<svg width="600" height="400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="officegrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#764ba2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f093fb;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="techgrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4facfe;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00f2fe;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="600" height="400" fill="url(#officegrad)"/>
  
  <!-- Floating tech elements -->
  <g opacity="0.6">
    <!-- Code brackets -->
    <text x="50" y="100" font-family="monospace" font-size="40" fill="rgba(255,255,255,0.4)" opacity="0.8">&lt;/&gt;</text>
    <text x="450" y="80" font-family="monospace" font-size="35" fill="rgba(255,255,255,0.4)" opacity="0.7">{ }</text>
    <text x="100" y="350" font-family="monospace" font-size="30" fill="rgba(255,255,255,0.4)" opacity="0.6">( )</text>
    <text x="480" y="320" font-family="monospace" font-size="38" fill="rgba(255,255,255,0.4)" opacity="0.5">[ ]</text>
  </g>
  
  <!-- Abstract tech lines -->
  <g stroke="rgba(255,255,255,0.2)" stroke-width="2" fill="none" opacity="0.5">
    <path d="M100,150 Q300,100 500,150" stroke-dasharray="5,5">
      <animate attributeName="stroke-dashoffset" from="0" to="100" dur="20s" repeatCount="indefinite"/>
    </path>
    <path d="M50,250 Q200,200 350,250" stroke-dasharray="5,5">
      <animate attributeName="stroke-dashoffset" from="0" to="100" dur="15s" repeatCount="defindefinite"/>
    </path>
    <path d="M250,300 Q400,250 550,300" stroke-dasharray="5,5">
      <animate attributeName="stroke-dashoffset" from="0" to="100" dur="18s" repeatCount="defindefinite"/>
    </path>
  </g>
  
  <!-- Tech nodes network -->
  <g opacity="0.8">
    <circle cx="150" cy="180" r="25" fill="url(#techgrad)" filter="url(#glow)">
      <animate attributeName="r" from="25" to="35" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" from="0.8" to="0.4" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="450" cy="160" r="20" fill="url(#techgrad)" filter="url(#glow)">
      <animate attributeName="r" from="20" to="30" dur="3.5s" repeatCount="defindefinite"/>
      <animate attributeName="opacity" from="0.7" to="0.3" dur="3.5s" repeatCount="defindefinite"/>
    </circle>
    <circle cx="300" cy="280" r="22" fill="url(#techgrad)" filter="url(#glow)">
      <animate attributeName="r" from="22" to="32" dur="3.8s" repeatCount="defindefinite"/>
      <animate attributeName="opacity" from="0.75" to="0.35" dur="3.8s" repeatCount="defindefinite"/>
    </circle>
  </g>
  
  <!-- Connection lines between nodes -->
  <g stroke="rgba(79, 172, 254, 0.4)" stroke-width="2" fill="none" opacity="0.6">
    <line x1="175" y1="180" x2="430" y2="160" stroke-dasharray="3,3">
      <animate attributeName="stroke-dashoffset" from="0" to="100" dur="8s" repeatCount="defindefinite"/>
    </line>
    <line x1="175" y1="180" x2="278" y2="280" stroke-dasharray="3,3">
      <animate attributeName="stroke-dashoffset" from="0" to="100" dur="7s" repeatCount="defindefinite"/>
    </line>
    <line x1="450" y1="160" x2="322" y2="280" stroke-dasharray="3,3">
      <animate attributeName="stroke-dashoffset" from="0" to="100" dur="9s" repeatCount="defindefinite"/>
    </line>
  </g>
  
  <!-- Abstract geometric shapes -->
  <g opacity="0.2">
    <rect x="80" y="120" width="60" height="60" fill="rgba(255,255,255,0.1)" rx="12" transform="rotate(45 110 150)">
      <animateTransform attributeName="transform" type="rotate" from="45 110 150" to="405 110 150" dur="20s" repeatCount="indefinite"/>
    </rect>
    <rect x="420" y="100" width="50" height="50" fill="rgba(255,255,255,0.1)" rx="10" transform="rotate(-30 445 125)">
      <animateTransform attributeName="transform" type="rotate" from="-30 445 125" to="330 445 125" dur="25s" repeatCount="defindefinite"/>
    </rect>
    <rect x="250" y="220" width="40" height="40" fill="rgba(255,255,255,0.1)" rx="8" transform="rotate(60 270 240)">
      <animateTransform attributeName="transform" type="rotate" from="60 270 240" to="420 270 240" dur="15s" repeatCount="indefinite"/>
    </rect>
  </g>
  
  <!-- Data particles -->
  <g opacity="0.7">
    <circle cx="200" cy="150" r="2" fill="#4facfe">
      <animate attributeName="cy" from="150" to="100" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" from="1" to="0" dur="5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="400" cy="200" r="2" fill="#00f2fe">
      <animate attributeName="cy" from="200" to="250" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" from="1" to="0" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="300" cy="120" r="1.5" fill="#f093fb">
      <animate attributeName="cy" from="120" to="70" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" from="1" to="0" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="350" cy="320" r="2" fill="#764ba2">
      <animate attributeName="cy" from="320" to="370" dur="4.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" from="1" to="0" dur="4.5s" repeatCount="defindefinite"/>
    </circle>
  </g>
  
  <!-- Binary rain effect -->
  <g opacity="0.3" font-family="monospace" font-size="10" fill="rgba(255,255,255,0.4)">
    <text x="50" y="380">01101001 10110010</text>
    <text x="150" y="390">11010101 01010110</text>
    <text x="250" y="380">00110101 11100100</text>
    <text x="350" y="390">10101010 01010101</text>
    <text x="450" y="380">11110000 10101010</text>
    <text x="550" y="390">01010101 11010101</text>
  </g>
</svg>
