<svg width="300" height="128" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="webgrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#764ba2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f093fb;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="300" height="128" fill="url(#webgrad)" rx="8"/>
  
  <!-- Code elements -->
  <text x="30" y="30" font-family="monospace" font-size="8" fill="rgba(255,255,255,0.8)" opacity="0.7">&lt;div&gt;</text>
  <text x="30" y="45" font-family="monospace" font-size="8" fill="rgba(255,255,255,0.8)" opacity="0.7">  &lt;h1&gt;</text>
  <text x="30" y="60" font-family="monospace" font-size="8" fill="rgba(255,255,255,0.8)" opacity="0.7">  &lt;/h1&gt;</text>
  <text x="30" y="75" font-family="monospace" font-size="8" fill="rgba(255,255,255,0.8)" opacity="0.7">&lt;/div&gt;</text>
  
  <!-- Browser window -->
  <rect x="100" y="25" width="120" height="78" fill="rgba(0,0,0,0.3)" rx="4"/>
  <rect x="100" y="25" width="120" height="20" fill="rgba(255,255,255,0.1)" rx="4"/>
  <circle cx="110" cy="35" r="3" fill="#ff5f56"/>
  <circle cx="120" cy="35" r="3" fill="#ffbd2e"/>
  <circle cx="130" cy="35" r="3" fill="#27c93f"/>
  
  <!-- Web content -->
  <rect x="110" y="55" width="100" height="6" fill="rgba(255,255,255,0.3)" rx="2"/>
  <rect x="110" y="65" width="80" height="6" fill="rgba(255,255,255,0.3)" rx="2"/>
  <rect x="110" y="75" width="90" height="6" fill="rgba(255,255,255,0.3)" rx="2"/>
  <rect x="110" y="85" width="70" height="6" fill="rgba(255,255,255,0.3)" rx="2"/>
  
  <!-- Floating particles -->
  <circle cx="250" cy="30" r="2" fill="rgba(255,255,255,0.6)">
    <animate attributeName="cy" from="30" to="100" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" from="1" to="0" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="20" cy="100" r="1.5" fill="rgba(255,255,255,0.6)">
    <animate attributeName="cy" from="100" to="30" dur="2.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" from="1" to="0" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Tech symbols -->
  <text x="260" y="70" font-family="monospace" font-size="12" fill="rgba(255,255,255,0.8)" opacity="0.7">&lt;/&gt;</text>
  <text x="260" y="90" font-family="monospace" font-size="10" fill="rgba(255,255,255,0.8)" opacity="0.6">{ }</text>
</svg>
