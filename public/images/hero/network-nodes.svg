<svg width="1920" height="1080" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="networkgrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0F172A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1E293B;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="nodegrad">
      <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#3B82F6;stop-opacity:0.2" />
    </radialGradient>
  </defs>
  <rect width="1920" height="1080" fill="url(#networkgrad)"/>
  
  <!-- Network connections -->
  <g stroke="rgba(59, 130, 246, 0.3)" stroke-width="2" fill="none">
    <line x1="300" y1="300" x2="600" y2="200"/>
    <line x1="600" y1="200" x2="900" y2="350"/>
    <line x1="900" y1="350" x2="1200" y2="250"/>
    <line x1="1200" y1="250" x2="1500" y2="400"/>
    <line x1="300" y1="300" x2="500" y2="600"/>
    <line x1="500" y1="600" x2="900" y2="700"/>
    <line x1="900" y1="700" x2="1300" y2="650"/>
    <line x1="600" y1="200" x2="800" y2="500"/>
    <line x1="1200" y1="250" x2="1000" y2="550"/>
  </g>
  
  <!-- Network nodes -->
  <g>
    <circle cx="300" cy="300" r="30" fill="url(#nodegrad)"/>
    <circle cx="300" cy="300" r="10" fill="#3B82F6"/>
    
    <circle cx="600" cy="200" r="25" fill="url(#nodegrad)"/>
    <circle cx="600" cy="200" r="8" fill="#7C3AED"/>
    
    <circle cx="900" cy="350" r="35" fill="url(#nodegrad)"/>
    <circle cx="900" cy="350" r="12" fill="#10B981"/>
    
    <circle cx="1200" cy="250" r="28" fill="url(#nodegrad)"/>
    <circle cx="1200" cy="250" r="9" fill="#F59E0B"/>
    
    <circle cx="1500" cy="400" r="32" fill="url(#nodegrad)"/>
    <circle cx="1500" cy="400" r="11" fill="#EF4444"/>
    
    <circle cx="500" cy="600" r="26" fill="url(#nodegrad)"/>
    <circle cx="500" cy="600" r="8" fill="#8B5CF6"/>
    
    <circle cx="900" cy="700" r="30" fill="url(#nodegrad)"/>
    <circle cx="900" cy="700" r="10" fill="#3B82F6"/>
    
    <circle cx="1300" cy="650" r="28" fill="url(#nodegrad)"/>
    <circle cx="1300" cy="650" r="9" fill="#10B981"/>
    
    <circle cx="800" cy="500" r="24" fill="url(#nodegrad)"/>
    <circle cx="800" cy="500" r="7" fill="#7C3AED"/>
    
    <circle cx="1000" cy="550" r="26" fill="url(#nodegrad)"/>
    <circle cx="1000" cy="550" r="8" fill="#F59E0B"/>
  </g>
  
  <!-- Data particles -->
  <g opacity="0.6">
    <circle cx="450" cy="250" r="3" fill="#3B82F6">
      <animate attributeName="cy" from="250" to="50" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" from="1" to="0" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="750" cy="275" r="3" fill="#7C3AED">
      <animate attributeName="cy" from="275" to="75" dur="3.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" from="1" to="0" dur="3.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1050" cy="300" r="3" fill="#10B981">
      <animate attributeName="cy" from="300" to="100" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" from="1" to="0" dur="4s" repeatCount="indefinite"/>
    </circle>
  </g>
  
  <!-- Tech elements -->
  <rect x="100" y="800" width="150" height="100" fill="none" stroke="rgba(59, 130, 246, 0.2)" stroke-width="2" rx="8"/>
  <rect x="1600" y="150" width="180" height="120" fill="none" stroke="rgba(124, 58, 237, 0.2)" stroke-width="2" rx="8"/>
</svg>
