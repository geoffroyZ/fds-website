<svg width="300" height="128" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="mobilegrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#764ba2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f093fb;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="300" height="128" fill="url(#mobilegrad)" rx="8"/>
  
  <!-- Phone mockup -->
  <rect x="50" y="20" width="60" height="88" fill="#1a1a1a" rx="6" opacity="0.9"/>
  <rect x="54" y="28" width="52" height="72" fill="#000" rx="3"/>
  <rect x="58" y="32" width="44" height="64" fill="url(#mobilegrad)" opacity="0.8" rx="2"/>
  
  <!-- Phone screen content -->
  <text x="80" y="48" font-family="monospace" font-size="6" fill="#FFF" text-anchor="middle" opacity="0.9">FDS App</text>
  <rect x="62" y="55" width="36" height="4" fill="#D1FAE5" rx="1"/>
  <rect x="62" y="62" width="32" height="4" fill="#D1FAE5" rx="1"/>
  <rect x="62" y="69" width="28" height="4" fill="#D1FAE5" rx="1"/>
  <circle cx="80" cy="85" r="6" fill="#FFF" opacity="0.8"/>
  
  <!-- Tablet mockup -->
  <rect x="130" y="25" width="80" height="78" fill="#1a1a1a" rx="4" opacity="0.9"/>
  <rect x="133" y="30" width="74" height="68" fill="#000" rx="2"/>
  <rect x="136" y="33" width="68" height="58" fill="url(#mobilegrad)" opacity="0.8" rx="2"/>
  
  <!-- Tablet screen content -->
  <text x="170" y="48" font-family="monospace" font-size="8" fill="#FFF" text-anchor="middle" opacity="0.9">FDS Portal</text>
  <rect x="143" y="55" width="54" height="5" fill="#D1FAE5" rx="1"/>
  <rect x="143" y="63" width="48" height="5" fill="#D1FAE5" rx="1"/>
  <rect x="143" y="71" width="50" height="5" fill="#D1FAE5" rx="1"/>
  <rect x="143" y="79" width="45" height="5" fill="#D1FAE5" rx="1"/>
  
  <!-- Connection line -->
  <line x1="110" y1="64" x2="130" y2="64" stroke="rgba(255,255,255,0.4)" stroke-width="2" stroke-dasharray="3,3">
    <animate attributeName="stroke-dashoffset" from="0" to="100" dur="2s" repeatCount="indefinite"/>
  </line>
  
  <!-- Floating particles -->
  <circle cx="230" cy="40" r="2" fill="rgba(255,255,255,0.6)">
    <animate attributeName="cy" from="40" to="90" dur="2.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" from="1" to="0" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="250" cy="80" r="1.5" fill="rgba(255,255,255,0.6)">
    <animate attributeName="cy" from="80" to="30" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" from="1" to="0" dur="2s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Tech symbols -->
  <text x="240" y="110" font-family="monospace" font-size="10" fill="rgba(255,255,255,0.8)" opacity="0.7">React</text>
  <text x="30" y="110" font-family="monospace" font-size="10" fill="rgba(255,255,255,0.8)" opacity="0.7">iOS</text>
</svg>
