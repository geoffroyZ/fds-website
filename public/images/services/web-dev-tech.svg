<svg width="400" height="160" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="webgrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#764ba2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f093fb;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="codegrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4facfe;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00f2fe;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="160" fill="url(#webgrad)" rx="12"/>
  
  <!-- Floating code elements -->
  <g opacity="0.7" font-family="monospace" font-size="10" fill="rgba(255,255,255,0.8)">
    <text x="20" y="30" opacity="0.9">&lt;div&gt;</text>
    <text x="20" y="45" opacity="0.7">  className="app"</text>
    <text x="20" y="60" opacity="0.8">&lt;/div&gt;</text>
    
    <text x="220" y="30" opacity="0.8">function</text>
    <text x="220" y="45" opacity="0.6">App() {</text>
    <text x="220" y="60" opacity="0.7">  return (</text>
    <text x="220" y="75" opacity="0.6">    &lt;div&gt;</text>
    <text x="220" y="90" opacity="0.8">      Hello</text>
    <text x="220" y="105" opacity="0.6">    &lt;/div&gt;</text>
    <text x="220" y="120" opacity="0.7">  );</text>
    <text x="220" y="135" opacity="0.8">}</text>
  </g>
  
  <!-- Tech nodes -->
  <circle cx="100" cy="80" r="15" fill="url(#codegrad)" filter="url(#glow)">
    <animate attributeName="r" from="15" to="20" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" from="0.8" to="0.4" dur="3s" repeatCount="indefinite"/>
  </circle>
  
  <circle cx="300" cy="80" r="12" fill="url(#codegrad)" filter="url(#glow)">
    <animate attributeName="r" from="12" to="18" dur="2.5s" repeatCount="defindefinite"/>
    <animate attributeName="opacity" from="0.7" to="0.3" dur="2.5s" repeatCount="defindefinite"/>
  </circle>
  
  <!-- Connection line -->
  <line x1="115" y1="80" x2="285" y2="80" stroke="rgba(79, 172, 254, 0.5)" stroke-width="2" opacity="0.6"/>
  
  <!-- Floating particles -->
  <g opacity="0.6">
    <circle cx="50" cy="40" r="2" fill="#4facfe">
      <animate attributeName="cy" from="40" to="20" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" from="1" to="0" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="350" cy="40" r="2" fill="#00f2fe">
      <animate attributeName="cy" from="40" to="60" dur="3s" repeatCount="defindefinite"/>
      <animate attributeName="opacity" from="1" to="0" dur="3s repeatCount="defindefinite"/>
    </circle>
    <circle cx="200" cy="120" r="1.5" fill="#f093fb">
      <animate attributeName="cy" from="120" to="100" dur="2s" repeatCount="defindefinite"/>
      <animate attributeName="opacity" from="1" to="0" dur="2s repeatCount="defindefinite"/>
    </circle>
  </g>
</svg>
