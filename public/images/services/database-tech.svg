<svg width="400" height="160" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="dbgrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#764ba2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f093fb;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="datagrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4facfe;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00f2fe;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="160" fill="url(#dbgrad)" rx="12"/>
  
  <!-- Database server -->
  <rect x="30" y="40" width="80" height="100" fill="#1a1a1a" rx="4" opacity="0.9"/>
  <ellipse cx="70" cy="50" rx="35" ry="8" fill="url(#datagrad)" opacity="0.8"/>
  <rect x="35" y="50" width="70" height="20" fill="url(#datagrad)" opacity="0.8"/>
  <ellipse cx="70" cy="70" rx="35" ry="8" fill="#4facfe" opacity="0.7"/>
  <rect x="35" y="70" width="70" height="20" fill="url(#datagrad)" opacity="0.8"/>
  <ellipse cx="70" cy="90" rx="35" ry="8" fill="#00f2fe" opacity="0.7"/>
  <rect x="35" y="90" width="70" height="20" fill="url(#datagrad)" opacity="0.8"/>
  <ellipse cx="70" cy="110" rx="35" ry="8" fill="#4facfe" opacity="0.7"/>
  <rect x="35" y="110" width="70" height="20" fill="url(#datagrad)" opacity="0.8"/>
  <ellipse cx="70" cy="130" rx="35" ry="8" fill="#00f2fe" opacity="0.7"/>
  
  <!-- Cloud storage -->
  <ellipse cx="200" cy="60" rx="40" ry="20" fill="rgba(255,255,255,0.2)" opacity="0.8"/>
  <ellipse cx="180" cy="65" rx="25" ry="15" fill="rgba(255,255,255,0.3)" opacity="0.8"/>
  <ellipse cx="220" cy="65" rx="25" ry="15" fill="rgba(255,255,255,0.3)" opacity="0.8"/>
  <rect x="160" y="65" width="80" height="40" fill="rgba(255,255,255,0.2)" opacity="0.6"/>
  
  <!-- Server rack -->
  <rect x="290" y="30" width="90" height="120" fill="#1a1a1a" rx="4" opacity="0.9"/>
  <rect x="295" y="35" width="80" height="15" fill="rgba(79, 172, 254, 0.3)" rx="2"/>
  <rect x="295" y="55" width="80" height="15" fill="rgba(79, 172, 254, 0.3)" rx="2"/>
  <rect x="295" y="75" width="80" height="15" fill="rgba(79, 172, 254, 0.3)" rx="2"/>
  <rect x="295" y="95" width="80" height="15" fill="rgba(79, 172, 254, 0.3)" rx="2"/>
  <rect x="295" y="115" width="80" height="15" fill="rgba(79, 172, 254, 0.3)" rx="2"/>
  
  <!-- Server lights -->
  <g>
    <circle cx="305" cy="42" r="2" fill="#10B981" opacity="0.9">
      <animate attributeName="opacity" from="0.9" to="0.3" dur="1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="315" cy="42" r="2" fill="#10B981" opacity="0.9">
      <animate attributeName="opacity" from="0.9" to="0.3" dur="1.5s" repeatCount="defindefinite"/>
    </circle>
    <circle cx="325" cy="42" r="2" fill="#EF4444" opacity="0.9">
      <animate attributeName="opacity" from="0.9" to="0.3" dur="2s" repeatCount="defindefinite"/>
    </circle>
    
    <circle cx="305" cy="62" r="2" fill="#10B981" opacity="0.9">
      <animate attributeName="opacity" from="0.9" to="0.3" dur="1.2s" repeatCount="defindefinite"/>
    </circle>
    <circle cx="315" cy="62" r="2" fill="#10B981" opacity="0.9">
      <animate attributeName="opacity" from="0.9" to="0.3" dur="0.8s" repeatCount="defindefinite"/>
    </circle>
    <circle cx="325" cy="62" r="2" fill="#10B981" opacity="0.9">
      <animate attributeName="opacity" from="0.9" to="0.3" dur="1.4s" repeatCount="defindefinite"/>
    </circle>
  </g>
  
  <!-- Data flow connections -->
  <g stroke="rgba(79, 172, 254, 0.5)" stroke-width="2" fill="none" opacity="0.7">
    <path d="M110,90 Q160,85 160,85" stroke-dasharray="3,3">
      <animate attributeName="stroke-dashoffset" from="0" to="100" dur="3s" repeatCount="defindefinite"/>
    </path>
    <path d="M240,85 Q280,90 290,90" stroke-dasharray="3,3">
      <animate attributeName="stroke-dashoffset" from="0" to="100" dur="3s" repeatCount="defindefinite"/>
    </path>
  </g>
  
  <!-- Floating data particles -->
  <g opacity="0.8">
    <circle cx="150" cy="85" r="2" fill="#4facfe">
      <animate attributeName="cx" from="150" to="160" dur="2s" repeatCount="defindefinite"/>
      <animate attributeName="opacity" from="1" to="0" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="250" cy="85" r="2" fill="#00f2fe">
      <animate attributeName="cx" from="250" to="260" dur="2.5s" repeatCount="defindefinite"/>
      <animate attributeName="opacity" from="1" to="0" dur="2.5s" repeatCount="defindefinite"/>
    </circle>
    <circle cx="200" cy="70" r="1.5" fill="#f093fb">
      <animate attributeName="cy" from="70" to="60" dur="1.8s" repeatCount="defindefinite"/>
      <animate attributeName="opacity" from="1" to="0" dur="1.8s" repeatCount="defindefinite"/>
    </circle>
  </g>
  
  <!-- Binary code decoration -->
  <g opacity="0.4" font-family="monospace" font-size="8" fill="rgba(255,255,255,0.6)">
    <text x="40" y="155">01101001</text>
    <text x="180" y="155">10110010</text>
    <text x="320" y="155">11010101</text>
  </g>
</svg>
